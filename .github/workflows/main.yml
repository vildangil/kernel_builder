name: A03 Core Kernel Builder

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 'android_kernel_m168 branch'
        required: true
        default: '4.14.199-erofs'
      defconfig:
        description: 'Kernel defconfig'
        required: true
        default: 'a3core_eur_open_defconfig'
      filesystem:
        description: 'Filesystem support variant'
        required: true
        type: choice
        options:
          - EROFS
          - EXT4
        default: EROFS
      rootSolution:
        description: 'Kernel root implementation'
        required: true
        type: choice
        options:
          - ReSukiSU
          - KernelSU-Next
        default: ReSukiSU
      disableCm4Watchdog:
        description: 'Disable PM_SYS/CM4 watchdog for reboot debugging'
        required: true
        type: boolean
        default: false
      isPermissive:
        description: 'Force permissive SELinux kernel'
        required: true
        type: boolean
        default: false
      isFlashableZip:
        description: 'Generate AnyKernel3 flashable zip'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      KERNEL_REPO: https://github.com/vildangil/android_kernel_m168
      KERNEL_DIR: ${{ github.workspace }}/kernel
      CROSS_COMPILE: "${{ github.workspace }}/toolchains/gcc-14.3/bin/aarch64-none-linux-gnu-"
      CROSS_COMPILE_ARM32: "${{ github.workspace }}/toolchains/gcc-14.3/bin/arm-none-linux-gnueabihf-"
      CC: clang

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Resolve build options
        shell: bash
        run: |
          set -euxo pipefail
          echo "KERNEL_BRANCH=${{ inputs.KERNEL_BRANCH }}" >> "$GITHUB_ENV"
          echo "DEFCONFIG=${{ inputs.defconfig }}" >> "$GITHUB_ENV"
          echo "FILESYSTEM=${{ inputs.filesystem }}" >> "$GITHUB_ENV"
          echo "ROOT_SOLUTION=${{ inputs.rootSolution }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make gcc g++ python3 bc libncurses-dev flex bison ccache \
            libssl-dev libelf-dev libyaml-dev wget curl tar xz-utils zip unzip git

      - name: Clone A03 Core kernel
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --single-branch \
            --branch "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"
          git -C "$KERNEL_DIR" log -1 --oneline

      - name: Setup GCC 14.3 and AOSP Clang
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p toolchains/gcc-14.3 toolchains/clang-r383902b

          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C toolchains/clang-r383902b
          rm clang.tar.gz

          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
          tar -xf gcc.tar.xz -C toolchains/gcc-14.3 --strip-components=1
          rm gcc.tar.xz

          echo "${{ github.workspace }}/toolchains/clang-r383902b/bin" >> "$GITHUB_PATH"
          echo "${{ github.workspace }}/toolchains/gcc-14.3/bin" >> "$GITHUB_PATH"

      - name: Integrate selected KernelSU implementation
        shell: bash
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail

          rm -rf KernelSU KernelSU-Next
          rm -f drivers/kernelsu

          case "$ROOT_SOLUTION" in
            KernelSU-Next)
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
              ;;
            ReSukiSU)
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
              ;;
            *)
              echo "Unsupported root solution: $ROOT_SOLUTION" >&2
              exit 2
              ;;
          esac

          readlink -f drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

      - name: Disable CM4 watchdog for diagnostic build
        if: ${{ inputs.disableCm4Watchdog == true }}
        shell: bash
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('drivers/watchdog/sprd_pmic_wdt.c')
          text = path.read_text()

          start = text.find('static bool sprd_pimc_wdt_en(void)')
          end = text.find('static const struct of_device_id', start)
          if start < 0 or end < 0:
              raise SystemExit(f'Could not locate sprd_pimc_wdt_en() in {path}')

          block = text[start:end]
          old = '\treturn true;'
          new = '\treturn false; /* diagnostic: disable PM_SYS/CM4 watchdog */'
          if old not in block:
              raise SystemExit('Expected final return true in sprd_pimc_wdt_en() not found')

          block = block.replace(old, new, 1)
          path.write_text(text[:start] + block + text[end:])
          PY

          sed -n '/static bool sprd_pimc_wdt_en/,/static const struct of_device_id/p' \
            drivers/watchdog/sprd_pmic_wdt.c | tail -n 18

      - name: Configure kernel
        shell: bash
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail

          make O=out ARCH="$ARCH" "$DEFCONFIG"
          chmod +x scripts/config

          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e KSU_MANUAL_HOOK

          if [ "$ROOT_SOLUTION" = "ReSukiSU" ]; then
            scripts/config --file out/.config -d KSU_TRACEPOINT_HOOK || true
            scripts/config --file out/.config -d KSU_SUSFS || true
          else
            scripts/config --file out/.config -d KSU_KPROBES_HOOK || true
          fi

          case "$FILESYSTEM" in
            EROFS)
              scripts/config --file out/.config -e EROFS_FS
              scripts/config --file out/.config -e EROFS_FS_XATTR
              scripts/config --file out/.config -e EROFS_FS_POSIX_ACL
              scripts/config --file out/.config -e EROFS_FS_SECURITY
              scripts/config --file out/.config -e EROFS_FS_ZIP
              scripts/config --file out/.config -e EROFS_FS_ARMV8_ACCELERATED_LZ4
              scripts/config --file out/.config --set-val EROFS_FS_CLUSTER_PAGE_LIMIT 1
              ;;
            EXT4)
              scripts/config --file out/.config -e EXT4_FS
              scripts/config --file out/.config -e EXT4_FS_POSIX_ACL
              scripts/config --file out/.config -e EXT4_FS_SECURITY
              scripts/config --file out/.config -e EXT4_ENCRYPTION
              scripts/config --file out/.config -e EXT4_FS_ENCRYPTION

              scripts/config --file out/.config -d EROFS_FS
              scripts/config --file out/.config -d EROFS_FS_XATTR || true
              scripts/config --file out/.config -d EROFS_FS_POSIX_ACL || true
              scripts/config --file out/.config -d EROFS_FS_SECURITY || true
              scripts/config --file out/.config -d EROFS_FS_ZIP || true
              scripts/config --file out/.config -d EROFS_FS_ARMV8_ACCELERATED_LZ4 || true
              ;;
            *)
              echo "Unsupported filesystem: $FILESYSTEM" >&2
              exit 2
              ;;
          esac

          make O=out ARCH="$ARCH" olddefconfig

          echo "===== KernelSU config ====="
          grep -E '^CONFIG_KSU|^# CONFIG_KSU' out/.config || true
          echo "===== Filesystem config ====="
          grep -E '^CONFIG_(EROFS|EXT4)|^# CONFIG_(EROFS|EXT4)' out/.config || true

      - name: Patch permissive
        if: ${{ inputs.isPermissive == true }}
        shell: bash
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          git fetch --depth 1 origin KernelSU-permissive
          git checkout FETCH_HEAD -- security/selinux/hooks.c security/selinux/selinuxfs.c

      - name: Build kernel
        shell: bash
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail

          export KBUILD_BUILD_USER="VildanG"
          export KBUILD_BUILD_HOST="$(. /etc/os-release && echo ${NAME}-${VERSION_ID})"
          export KBUILD_BUILD_TIMESTAMP="$(date -R)"

          sed -i '/yamltree.o/d' scripts/dtc/Makefile
          sed -i '/dt_to_yaml/d' scripts/dtc/dtc.c

          make O=out -j"$(nproc)" \
            ARCH="$ARCH" CC="$CC" CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" Image

          test -s out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: Build AnyKernel3 flashable zip
        if: ${{ inputs.isFlashableZip == true }}
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AK3
          cp "$KERNEL_DIR/out/arch/arm64/boot/Image" AK3/

          cd AK3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i "s/kernel.string=.*/kernel.string=A03-Core-${FILESYSTEM}-${ROOT_SOLUTION} by VildanG/g" anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=auto;|g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/g' anykernel.sh
          sed -i '/# init.rc/,/append_file fstab.tuna.*/d' anykernel.sh

          zip -r9 "../A03-Core-${FILESYSTEM}-${ROOT_SOLUTION}.zip" . -x '.git/*' '.github/*'
          cd ..
          ls -lh "A03-Core-${FILESYSTEM}-${ROOT_SOLUTION}.zip"

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: A03-Core-Image-${{ env.FILESYSTEM }}-${{ env.ROOT_SOLUTION }}
          path: |
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image
            ${{ env.KERNEL_DIR }}/out/.config
          retention-days: 14

      - name: Upload AnyKernel3 zip
        if: ${{ inputs.isFlashableZip == true }}
        uses: actions/upload-artifact@v4
        with:
          name: A03-Core-AnyKernel3-${{ env.FILESYSTEM }}-${{ env.ROOT_SOLUTION }}
          path: ${{ github.workspace }}/A03-Core-${{ env.FILESYSTEM }}-${{ env.ROOT_SOLUTION }}.zip
          retention-days: 14
