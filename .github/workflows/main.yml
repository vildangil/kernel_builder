name: A03 Core Telegram Builder

on:
  workflow_dispatch:
    inputs:
      COMPILER:
        description: 'compiler profile'
        required: true
        default: 'A03-Clang'
      KREPO:
        description: 'kernel repo'
        required: true
        default: 'https://github.com/vildangil/android_kernel_m168'
      KBRANCH:
        description: 'kernel branch'
        required: true
        default: '4.14.199-erofs'
      FILESYSTEM:
        description: 'filesystem support'
        required: true
        type: choice
        options:
          - EROFS
          - EXT4
        default: EROFS
      ROOT_SOLUTION:
        description: 'kernel root implementation'
        required: true
        type: choice
        options:
          - ReSukiSU
          - KernelSU-Next
        default: ReSukiSU
      CM4_WATCHDOG_OFF:
        description: 'send watchdog rstoff to PM_SYS/CM4 (diagnostic)'
        required: true
        type: boolean
        default: true
      PERMISSIVE:
        description: 'apply permissive SELinux kernel patch'
        required: true
        type: boolean
        default: false
      NOTES:
        description: 'notes to print/send'
        required: false
        default: ''
      SUFFIX:
        description: 'suffix appended to output zip'
        required: false
        default: ''
      ZREPO:
        description: 'AnyKernel3 repo'
        required: true
        default: 'https://github.com/osm0sis/AnyKernel3'
      ZBRANCH:
        description: 'AnyKernel3 branch'
        required: true
        default: 'master'
      TG_RECIPENT:
        description: 'Telegram chat/group id override'
        required: false
        default: '-1003535423659'
      CONTAINER:
        description: 'build container'
        required: true
        default: 'ubuntu:22.04'

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHAT_ID: ${{ secrets.CHAT_ID }}
  REPO: ${{ inputs.KREPO }}
  RUN_NUM: ${{ github.run_number }}_${{ github.run_attempt }}
  KERNEL_BRANCH: ${{ inputs.KBRANCH }}
  NOTE: ${{ inputs.NOTES }}
  COMPILERS: ${{ inputs.COMPILER }}
  SUFFIX: ${{ inputs.SUFFIX }}
  zipper_repo: ${{ inputs.ZREPO }}
  zipper_branch: ${{ inputs.ZBRANCH }}
  BUILD_FILESYSTEM: ${{ inputs.FILESYSTEM }}
  ROOT_SOLUTION: ${{ inputs.ROOT_SOLUTION }}
  CM4_WATCHDOG_OFF: ${{ inputs.CM4_WATCHDOG_OFF }}
  PERMISSIVE: ${{ inputs.PERMISSIVE }}
  DEFCONFIG: a3core_eur_open_defconfig
  TZ: Europe/Riga

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ${{ inputs.CONTAINER }}

    steps:
      - name: Checkout A03 builder implementation
        uses: actions/checkout@v4
        with:
          repository: vildangil/kernel_builder
          ref: a3core
          fetch-depth: 1

      - name: Initialize build environment
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            git curl wget ca-certificates make gcc g++ python3 bc \
            libncurses-dev flex bison ccache libssl-dev libelf-dev \
            libyaml-dev tar xz-utils zip unzip file rsync
          ln -sf /usr/bin/python3 /usr/local/bin/python || true
          git config --global --add safe.directory '*'
          git config --global user.name 'VildanG Builder'
          git config --global user.email 'builder@localhost'

      - name: Initialize Telegram status
        shell: bash
        run: |
          echo "WORKFLOW_START=$(date +'%s')" >> "$GITHUB_ENV"
          ALT_RECIPENT='${{ inputs.TG_RECIPENT }}'
          if [ -n "$ALT_RECIPENT" ]; then
            echo "CHAT_ID=$ALT_RECIPENT" >> "$GITHUB_ENV"
          fi

          bash tg_utils.sh msg "gh $RUN_NUM: A03 Core build started%nlbranch: $KERNEL_BRANCH%nlfs: $BUILD_FILESYSTEM%nlroot: $ROOT_SOLUTION%nlcm4 watchdog off: $CM4_WATCHDOG_OFF%nlcompiler: $COMPILERS" || true

      - name: Show host info
        shell: bash
        run: |
          HOST_INFO="$(grep PRETTY_NAME /etc/os-release | cut -d= -f2- | tr -d '\"')"
          FREE_SPACE="$(df --sync -BM --output=avail / | tail -n 1 | xargs)"
          bash tg_utils.sh msg "gh $RUN_NUM: build env initialized%nlhost: $HOST_INFO%nlfree disk: $FREE_SPACE" || true

      - name: Print notes
        if: ${{ inputs.NOTES != '' }}
        shell: bash
        run: bash tg_utils.sh msg "gh $RUN_NUM: $NOTE" || true

      - name: Clone kernel source
        shell: bash
        run: |
          set -euxo pipefail
          bash tg_utils.sh msg "gh $RUN_NUM: cloning kernel%nlrepo: $REPO%nlbranch: $KERNEL_BRANCH" || true
          git clone --depth=1 --single-branch "$REPO" -b "$KERNEL_BRANCH" kernel

      - name: Print kernel info
        shell: bash
        run: |
          cd kernel
          source ../env
          INFO="gh $RUN_NUM: kernel: ${kernel_name}%nlversion: ${kernel_ver}%nlhead: ${kernel_head}%nldefconfig: ${defconfig}%nlfs: ${BUILD_FILESYSTEM}%nlroot: ${ROOT_SOLUTION}"
          bash ../tg_utils.sh msg "$INFO" || true

      - name: Prepare A03 Core kernel
        shell: bash
        run: |
          cd kernel
          bash ../tg_utils.sh msg "gh $RUN_NUM: preparing A03 Core source%nlReSukiSU/KSU + filesystem + watchdog options" || true
          bash ../prepare_a3core.sh

      - name: Compile and pack
        shell: bash
        run: |
          cd kernel
          bash ../tg_utils.sh msg "gh $RUN_NUM: compilation started: $COMPILERS" || true
          bash ../build.sh "$COMPILERS"

      - name: Upload build files to Telegram
        if: ${{ success() }}
        shell: bash
        run: |
          cd kernel
          shopt -s nullglob
          for file in *.zip; do
            caption="A03 Core build $RUN_NUM"
            [ -f "${file}.info" ] && caption="$(cat "${file}.info")"
            bash ../tg_utils.sh up "$file" "$caption" || true
          done
          for file in *.log; do
            caption="A03 Core compiler log $RUN_NUM"
            [ -f "${file}.info" ] && caption="$(cat "${file}.info")"
            bash ../tg_utils.sh up "$file" "$caption" || true
          done

      - name: Upload GitHub artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: A03-Core-${{ inputs.FILESYSTEM }}-${{ inputs.ROOT_SOLUTION }}-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
            kernel/*.zip
            kernel/*.log
            kernel/*.info
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure log to Telegram
        if: ${{ failure() }}
        shell: bash
        run: |
          if [ -d kernel ]; then
            cd kernel
            shopt -s nullglob
            for file in *.log; do
              bash ../tg_utils.sh up "$file" "gh $RUN_NUM: failed compiler log" || true
            done
          fi

      - name: Finish Telegram status
        if: ${{ always() }}
        shell: bash
        env:
          FINAL_STATUS: ${{ job.status }}
        run: |
          WORKFLOW_END=$(date +'%s')
          WORKFLOW_START=${WORKFLOW_START:-$WORKFLOW_END}
          WDIFF=$((WORKFLOW_END - WORKFLOW_START))
          bash tg_utils.sh msg "gh $RUN_NUM: A03 Core workflow ${FINAL_STATUS}%nltime: $((WDIFF / 60))m $((WDIFF % 60))s%nlfs: $BUILD_FILESYSTEM%nlroot: $ROOT_SOLUTION%nlcm4 watchdog off: $CM4_WATCHDOG_OFF" || true
