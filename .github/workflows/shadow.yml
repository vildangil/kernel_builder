name: Build shadow branch

on:
  push:
    branches:
      - fix/rosemary-build-bakasu-droidspaces
  workflow_dispatch:
    inputs:
      COMPILER:
        description: 'compilers used'
        required: true
        default: 'AOSP-Clang-11'
      KREPO:
        description: 'kernel repo'
        required: true
        default: 'https://github.com/vildangil/android_kernel_xiaomi_evolution'
      KBRANCH:
        description: 'kernel branch'
        required: true
        default: 'shadow'
      NOTES:
        description: 'notes to print out'
        required: false
        default: ''
      SUFFIX:
        description: 'suffix to aplly to teh zip filename'
        required: false
        default: ''
      ZREPO:
        description: 'zipper repo'
        required: true
        default: 'https://github.com/vildangil/BlackSide_Kernel_AnyKernel3'
      ZBRANCH:
        description: 'zipper branch'
        required: true
        default: 'rosemary'
      KSU:
        description: 'if dont want ksu then leave blank'
        required: false
        default: 'susfs'
      TG_RECIPENT:
        description: 'group id'
        required: false
        default: '-1003535423659'
      CONTAINER:
        description: 'if you know you know'
        required: true
        default: 'fedora:40'
      BORE:
        description: 'enable BORE 4.2.4 scheduler on Linux 4.14 (experimental)'
        type: boolean
        required: true
        default: true
      MTK_CONNECTIVITY:
        description: 'restore in-tree MT6785 WMT/WLAN drivers from rosemary-s'
        type: boolean
        required: true
        default: true
      DROIDSPACES:
        description: 'enable DroidSpaces namespace/cgroup support (non-GKI)'
        type: boolean
        required: true
        default: true

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHAT_ID: ${{ secrets.CHAT_ID }}
  REPO: ${{ inputs.KREPO || 'https://github.com/vildangil/android_kernel_xiaomi_evolution' }}
  RUN_NUM: ${{ github.run_number }}_${{ github.run_attempt }}
  KERNEL_BRANCH: ${{ inputs.KBRANCH || 'shadow' }}
  NOTE: ${{ inputs.NOTES }}
  COMPILERS: ${{ inputs.COMPILER || 'AOSP-Clang-11' }}
  PATCH_KSU: ${{ github.event_name == 'push' && 'susfs' || inputs.KSU }}
  DROIDSPACES: ${{ github.event_name == 'push' && 'true' || inputs.DROIDSPACES }}
  MTK_CONNECTIVITY: ${{ github.event_name == 'push' && 'true' || inputs.MTK_CONNECTIVITY }}
  BORE: ${{ github.event_name == 'push' && 'true' || inputs.BORE }}
  SUFFIX: ${{ inputs.SUFFIX }}
  zipper_repo: ${{ inputs.ZREPO || 'https://github.com/vildangil/BlackSide_Kernel_AnyKernel3' }}
  zipper_branch: ${{ inputs.ZBRANCH || 'rosemary' }}
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.CONTAINER || 'fedora:40' }}

    steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: why
          run: |
            echo WORKFLOW_START=$(date +"%s") >> $GITHUB_ENV
            ALT_RECIPENT="${{ inputs.TG_RECIPENT }}"
            if [ -n "$ALT_RECIPENT" ]; then
              echo CHAT_ID="$ALT_RECIPENT" >> $GITHUB_ENV
            fi
        - name: start of workflow
          run: |
            bash tg_utils.sh msg "gh $RUN_NUM: workflow started"
        - name: init build env
          run: |
            dnf group install development-tools -y
            dnf install which llvm lld bc bison ca-certificates curl flex glibc-devel.i686 glibc-devel binutils-devel openssl python3 python2 zstd clang gcc-arm-linux-gnu dtc libxml2 libarchive openssl-devel perl tomsfastmath-devel wget xz -y
            ln -sf "/usr/bin/python3" /usr/bin/python
            git config --global user.name "John Doe"
            git config --global user.email "idk@example.com"
        - name: show host info
          run: |
            if [ ! -z "$VERBOSE" ]; then
              bash tg_utils.sh msg "gh $RUN_NUM: build env initialized%nlgh $RUN_NUM: host: $(cat /etc/os-release | grep PRETTY_NAME | cut -d'=' -f2)%nlgh $RUN_NUM: free disk space: $(df --sync -BM --output=avail / | grep -v Avail)"
            fi
        - name: print notes if exists
          run: |
            if [ ! -z "$NOTE" ]; then
              bash tg_utils.sh msg "gh $RUN_NUM: $NOTE"
            fi
        - name: clone kernel source
          run: |
            if [ ! -z "$VERBOSE" ]; then
              bash tg_utils.sh msg "gh $RUN_NUM: cloning kernel source%nlgh $RUN_NUM: repo: $REPO%nlgh $RUN_NUM: branch: $KERNEL_BRANCH"
            fi
            git clone --depth=1 --single-branch $REPO -b $KERNEL_BRANCH kernel
        - name: restore MT6785 WMT/WLAN connectivity drivers
          if: ${{ inputs.MTK_CONNECTIVITY || github.event_name == 'push' }}
          shell: bash
          run: |
            set -euo pipefail
            cd kernel
            bash ../configs/restore-rosemary-connectivity.sh
        - name: enable DroidSpaces kernel features
          if: ${{ inputs.DROIDSPACES || github.event_name == 'push' }}
          shell: bash
          run: |
            set -euo pipefail
            cd kernel
            bash ../configs/enable-droidspaces.sh
        - name: port BORE 4.2.4 to MTK scheduler
          if: ${{ inputs.BORE || github.event_name == 'push' }}
          shell: bash
          run: |
            set -euo pipefail
            cd kernel
            python3 ../ksu/bore/port_shadow_bore.py ../ksu/bore/bore-4.14-4.2.4-reference.patch
        - name: print kernel info
          run: |
            cd kernel
            source ../env
            bash ../tg_utils.sh msg "gh $RUN_NUM: kernel name: ${kernel_name}%nlgh $RUN_NUM: kernel ver: ${kernel_ver}%nlgh $RUN_NUM: kernel head commit: ${kernel_head}%nlgh $RUN_NUM: defconfig: ${defconfig}"
        - name: run compilation scripts
          shell: bash
          run: |
            set -euo pipefail
            cd kernel
            case $PATCH_KSU in
              "both" )
                bash ../tg_utils.sh msg "gh $RUN_NUM: running compilation script(s): $COMPILERS"
                bash ../build.sh "$COMPILERS"
                bash ../tg_utils.sh msg "gh $RUN_NUM: KernelSU patching enabled, patching"
                bash ../ksu/ksu.sh
                bash ../tg_utils.sh msg "gh $RUN_NUM: running compilation script(s): $COMPILERS"
                bash ../build.sh "$COMPILERS"
              ;;
              "ksu" )
                bash ../tg_utils.sh msg "gh $RUN_NUM: BakaSU patching enabled, patching"
                bash ../ksu/ksu.sh
                bash ../tg_utils.sh msg "gh $RUN_NUM: running compilation script(s): $COMPILERS"
                bash ../build.sh "$COMPILERS"
              ;;
              "susfs" )
                bash ../tg_utils.sh msg "gh $RUN_NUM: BakaSU and susfs patching enabled, patching"
                bash ../ksu/susfs.sh
                bash ../tg_utils.sh msg "gh $RUN_NUM: running compilation script(s): $COMPILERS"
                bash ../build.sh "$COMPILERS"
              ;;
              "" )
                bash ../tg_utils.sh msg "gh $RUN_NUM: running compilation script(s): $COMPILERS"
                bash ../build.sh "$COMPILERS"
              ;;
              * )
                echo "Unknown PATCH_KSU mode: $PATCH_KSU" >&2
                exit 2
              ;;
            esac

        - name: upload build logs and rejects
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: rosemary-build-${{ github.run_number }}-${{ github.run_attempt }}
            path: |
              kernel/*.log
              kernel/*.log.info
              kernel/*.zip
              kernel/*.rej
              kernel/**/*.rej
              kernel/out/.config
            if-no-files-found: warn
            retention-days: 7
        - name: upload to Telegram
          if: success()
          shell: bash
          run: |
            shopt -s nullglob
            cd kernel
            for file in *.zip *.log; do
              if [[ -f "${file}.info" ]]; then
                bash ../tg_utils.sh up "${file}" "$(cat "${file}.info")"
              fi
            done
        - name: if it fails
          if: ${{ failure() }}
          run: |
            WORKFLOW_END=$(date +"%s")
            WDIFF=$((WORKFLOW_END - WORKFLOW_START))
            bash tg_utils.sh msg "gh $RUN_NUM: workflow failed in $((WDIFF / 60))m, $((WDIFF % 60))s"
        - name: end of workflow
          run: |
            WORKFLOW_END=$(date +"%s")
            WDIFF=$((WORKFLOW_END - WORKFLOW_START))
            bash tg_utils.sh msg "gh $RUN_NUM: workflow ended in $((WDIFF / 60))m, $((WDIFF % 60))s"
