name: A03 Core Telegram Builder

on:
  workflow_dispatch:
    inputs:
      COMPILER:
        description: 'compiler profile'
        required: true
        default: 'A03-Clang'
      KREPO:
        description: 'kernel repo'
        required: true
        default: 'https://github.com/vildangil/android_kernel_m168'
      KBRANCH:
        description: 'kernel branch'
        required: true
        default: '4.14.199-erofs'
      FILESYSTEM:
        description: 'filesystem build variant'
        required: true
        type: choice
        options:
          - EROFS
          - EXT4
          - BOTH
        default: EROFS
      ROOT_SOLUTION:
        description: 'kernel root implementation'
        required: true
        type: choice
        options:
          - ReSukiSU
          - KernelSU-Next
        default: ReSukiSU
      CM4_WATCHDOG_OFF:
        description: 'send watchdog rstoff to PM_SYS/CM4 (diagnostic)'
        required: true
        type: boolean
        default: true
      PERMISSIVE:
        description: 'apply permissive SELinux kernel patch'
        required: true
        type: boolean
        default: false
      NOTES:
        description: 'notes to print/send'
        required: false
        default: ''
      SUFFIX:
        description: 'suffix appended to output zip'
        required: false
        default: ''
      ZREPO:
        description: 'AnyKernel3 repo'
        required: true
        default: 'https://github.com/osm0sis/AnyKernel3'
      ZBRANCH:
        description: 'AnyKernel3 branch'
        required: true
        default: 'master'
      TG_RECIPENT:
        description: 'group id'
        required: false
        default: '-1003535423659'
      CONTAINER:
        description: 'build container'
        required: true
        default: 'ubuntu:22.04'

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHAT_ID: ${{ secrets.CHAT_ID }}
  REPO: ${{ inputs.KREPO }}
  RUN_NUM: ${{ github.run_number }}_${{ github.run_attempt }}
  KERNEL_BRANCH: ${{ inputs.KBRANCH }}
  NOTE: ${{ inputs.NOTES }}
  COMPILERS: ${{ inputs.COMPILER }}
  SUFFIX: ${{ inputs.SUFFIX }}
  zipper_repo: ${{ inputs.ZREPO }}
  zipper_branch: ${{ inputs.ZBRANCH }}
  BUILD_FILESYSTEM: ${{ inputs.FILESYSTEM }}
  ROOT_SOLUTION: ${{ inputs.ROOT_SOLUTION }}
  CM4_WATCHDOG_OFF: ${{ inputs.CM4_WATCHDOG_OFF }}
  PERMISSIVE: ${{ inputs.PERMISSIVE }}
  DEFCONFIG: a3core_eur_open_defconfig
  TZ: Europe/Riga

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ${{ inputs.CONTAINER }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          repository: vildangil/kernel_builder
          ref: a3core
          fetch-depth: 1

      - name: why
        shell: bash
        run: |
          echo "WORKFLOW_START=$(date +'%s')" >> "$GITHUB_ENV"
          ALT_RECIPENT='${{ inputs.TG_RECIPENT }}'
          if [ -n "$ALT_RECIPENT" ]; then
            echo "CHAT_ID=$ALT_RECIPENT" >> "$GITHUB_ENV"
          fi

      - name: start of workflow
        shell: bash
        run: |
          bash tg_utils.sh msg "gh $RUN_NUM: workflow started" || true

      - name: init build env
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            git curl wget ca-certificates make gcc g++ python3 bc \
            libncurses-dev flex bison ccache libssl-dev libelf-dev \
            libyaml-dev tar xz-utils zip unzip file rsync
          ln -sf /usr/bin/python3 /usr/local/bin/python || true
          git config --global --add safe.directory '*'
          git config --global user.name 'VildanG Builder'
          git config --global user.email 'builder@localhost'

      - name: print notes if exists
        if: ${{ inputs.NOTES != '' }}
        shell: bash
        run: |
          bash tg_utils.sh msg "gh $RUN_NUM: $NOTE" || true

      - name: clone kernel source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --single-branch "$REPO" -b "$KERNEL_BRANCH" kernel

      - name: print kernel info
        shell: bash
        run: |
          cd kernel
          source ../env
          bash ../tg_utils.sh msg "gh $RUN_NUM: kernel name: ${kernel_name}%nlgh $RUN_NUM: kernel ver: ${kernel_ver}%nlgh $RUN_NUM: kernel head commit: ${kernel_head}%nlgh $RUN_NUM: defconfig: ${defconfig}" || true

      - name: prepare A03 Core kernel
        shell: bash
        run: |
          cd kernel
          bash ../prepare_a3core.sh

      - name: run compilation scripts
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          build_variant() {
            local fs="$1"
            export BUILD_FILESYSTEM="$fs"

            bash ../build.sh "$COMPILERS"

            cp out/arch/arm64/boot/Image "A03-Core-${fs}-${ROOT_SOLUTION}.Image"
            cp out/.config "A03-Core-${fs}-${ROOT_SOLUTION}.config"

            shopt -s nullglob
            for log in *.log; do
              case "$log" in
                *-EROFS.log|*-EXT4.log) continue ;;
              esac
              local renamed="${log%.log}-${fs}.log"
              mv "$log" "$renamed"
              if [ -f "${log}.info" ]; then
                mv "${log}.info" "${renamed}.info"
              fi
            done
          }

          if [ "$BUILD_FILESYSTEM" = "BOTH" ]; then
            bash ../tg_utils.sh msg "gh $RUN_NUM: running compilation script(s): $COMPILERS (EROFS + EXT4)" || true
            build_variant EROFS
            build_variant EXT4
          else
            bash ../tg_utils.sh msg "gh $RUN_NUM: running compilation script(s): $COMPILERS" || true
            build_variant "$BUILD_FILESYSTEM"
          fi

      - name: upload
        if: ${{ success() }}
        shell: bash
        run: |
          cd kernel
          shopt -s nullglob
          for file in *.zip; do
            if [ -f "${file}.info" ]; then
              bash ../tg_utils.sh up "$file" "$(cat "${file}.info")" || true
            else
              bash ../tg_utils.sh up "$file" "gh $RUN_NUM: A03 Core kernel build" || true
            fi
          done
          for file in *.log; do
            if [ -f "${file}.info" ]; then
              bash ../tg_utils.sh up "$file" "$(cat "${file}.info")" || true
            fi
          done

      - name: Upload GitHub artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: A03-Core-${{ inputs.FILESYSTEM }}-${{ inputs.ROOT_SOLUTION }}-${{ github.run_number }}
          path: |
            kernel/A03-Core-*.Image
            kernel/A03-Core-*.config
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
            kernel/*.zip
            kernel/*.log
            kernel/*.info
          if-no-files-found: warn
          retention-days: 14

      - name: if it fails
        if: ${{ failure() }}
        shell: bash
        run: |
          WORKFLOW_END=$(date +'%s')
          WORKFLOW_START=${WORKFLOW_START:-$WORKFLOW_END}
          WDIFF=$((WORKFLOW_END - WORKFLOW_START))
          bash tg_utils.sh msg "gh $RUN_NUM: workflow failed in $((WDIFF / 60))m, $((WDIFF % 60))s" || true

      - name: end of workflow
        if: ${{ success() }}
        shell: bash
        run: |
          WORKFLOW_END=$(date +'%s')
          WORKFLOW_START=${WORKFLOW_START:-$WORKFLOW_END}
          WDIFF=$((WORKFLOW_END - WORKFLOW_START))
          bash tg_utils.sh msg "gh $RUN_NUM: workflow ended in $((WDIFF / 60))m, $((WDIFF % 60))s" || true
